<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090908" />
  <title>Camille Lab — Continuous Sliding Strip</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="experience" aria-hidden="true"></canvas>

  <div class="loading" id="loading" aria-live="polite">
    <span class="loading__label">Textures</span>
    <strong class="loading__value" id="loading-value">0%</strong>
  </div>

  <header class="chrome">
    <a class="brand" href="./" aria-label="Sounak Poddar Camille interaction laboratory">
      <span>Sounak Poddar</span>
      <small>Interaction Lab / 02B</small>
    </a>

    <button class="mode-button" id="mode-button" type="button" aria-pressed="false">
      <span class="mode-button__label">View all</span>
      <span class="mode-button__mark" aria-hidden="true"></span>
    </button>
  </header>

  <main class="ui">
    <section class="project-label" aria-live="polite" aria-atomic="true">
      <p id="project-index">01 / All-in-one academic workspace</p>
      <h1 id="project-title">StudentOS</h1>
      <a id="project-link" href="https://studentos.sentiqlabs.com/" target="_blank" rel="noopener noreferrer">
        Visit product <span aria-hidden="true">↗</span>
      </a>
    </section>

    <div class="strip-status" aria-hidden="true">
      <span id="project-counter">01 / 03</span>
      <span class="strip-status__line"></span>
      <span>drag / scroll</span>
    </div>

    <p class="gesture-hint">Drag or scroll to reveal the strip</p>
  </main>

  <div class="fallback" id="fallback" hidden>
    <p>WebGL could not initialize on this device.</p>
    <img
      src="https://i.ibb.co/jkB9vQLr/Screenshot-2026-07-14-182748.png"
      alt="StudentOS academic workspace interface"
    />
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
