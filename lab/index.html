<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090908" />
  <title>Camille Lab — Checkpoint 3A Loader</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="experience" aria-hidden="true"></canvas>

  <div class="loading" id="loading" aria-live="polite">
    <span class="loading__label">Textures</span>
    <strong class="loading__value" id="loading-value">0%</strong>
  </div>

  <header class="chrome">
    <a class="brand" href="./" aria-label="Sounak Poddar, work">Sounak Poddar</a>
    <nav class="top-nav" aria-label="Primary">
      <a href="./" aria-current="page">Work</a>
      <a href="#about-placeholder">About</a>
    </nav>
  </header>

  <main class="ui">
    <section class="focus-title" id="focus-title" aria-live="polite" aria-atomic="true">
      <h1 id="project-title">StudentOS</h1>
      <span class="focus-title__counter" id="project-counter">01</span>
    </section>

    <button class="cross cross--previous" id="previous-project" type="button" aria-label="Previous project">
      <span aria-hidden="true"></span>
    </button>
    <button class="cross cross--next" id="next-project" type="button" aria-label="Next project">
      <span aria-hidden="true"></span>
    </button>

    <button class="cross cross--center" id="open-active-project" type="button" aria-label="Open centered project">
      <span aria-hidden="true"></span>
    </button>

    <p class="gesture-hint">Scroll or drag to view all work</p>
  </main>

  <div id="about-placeholder" hidden></div>

  <div class="fallback" id="fallback" hidden>
    <p>WebGL could not initialize on this device.</p>
    <img
      src="https://i.ibb.co/jkB9vQLr/Screenshot-2026-07-14-182748.png"
      alt="StudentOS academic workspace interface"
    />
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
